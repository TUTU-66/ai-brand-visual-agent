<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>个人空间｜梦玉的能力岛</title>
  <link rel="stylesheet" href="account.css?v=site-audit-004">
  <script src="preview-mode.js"></script>
</head>
<body>
  <div class="space-loading" id="loading">正在读取个人空间…</div>

  <header class="member-topbar">
    <a class="member-brand" href="index.html"><img class="account-wordmark" src="assets/home-psd-001/mengyu-logo.webp" alt="MENGYU" width="2028" height="594"><strong>梦玉的能力岛</strong></a>
    <a class="member-enter" href="index.html">返回首页</a>
  </header>

  <main class="member-page">
    <section class="member-profile" aria-labelledby="profileName">
      <span class="avatar-block member-avatar" id="spaceAvatar" aria-hidden="true"></span>
      <div class="member-identity">
        <div class="member-name-line"><h1 id="profileName">—</h1><span class="member-tier" id="tierBadge">Free 成员</span></div>
        <p id="identitySummary">正在读取账户状态…</p>
      </div>
      <a class="member-upgrade" id="upgradeAction" href="membership.html">升级会员</a>
    </section>

    <section class="member-section" aria-labelledby="assetsTitle">
      <div class="member-section-head"><h2 id="assetsTitle">我的资产</h2><span id="assetTotal">0 项</span></div>
      <div class="asset-list" id="assetList" hidden></div>
      <div class="asset-empty" id="assetEmpty"><p>还没有保存的内容</p><a href="index.html">返回首页</a></div>
    </section>

    <details class="account-settings" id="accountSettings">
      <summary>账户设置</summary>
      <div class="account-settings-body">
        <form id="profileForm" class="profile-row">
          <div class="field"><label for="displayName">显示名称</label><input class="control" id="displayName" maxlength="24" autocomplete="nickname"></div>
          <button class="btn btn-primary" type="submit">保存名称</button>
        </form>
        <p class="profile-message" id="profileMessage" role="status"></p>
        <div class="security-row"><div><b>账号密码</b><span id="passwordStatus">正在读取安全状态…</span></div><a class="btn btn-secondary" id="passwordAction" href="register.html">设置密码</a></div>
        <div class="identity-list" id="identityList"></div>
        <nav class="account-policy-links" aria-label="账户说明"><a href="terms.html">用户协议</a><a href="privacy.html">隐私说明</a><a href="cancellation.html">账号注销说明</a></nav>
        <button class="member-logout" id="logout" type="button">退出登录</button>
      </div>
    </details>
  </main>

  <script src="platform-account.js?v=comic-ctrl01-1"></script>
<script src="platform-workspace.js"></script><script src="space.js?v=comic-ctrl01-1"></script>
</body>
</html>
