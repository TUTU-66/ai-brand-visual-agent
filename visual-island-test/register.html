<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>免费注册｜梦玉的能力岛</title>
  <meta name="description" content="注册 Free 账号，体验梦玉的能力岛">
  <link rel="stylesheet" href="account.css?v=site-audit-004">
  <script src="preview-mode.js"></script>
</head>
<body data-account-page="register">
  <main class="account-shell">
    <section class="account-context" aria-label="注册与会员说明">
      <a class="back-home" href="index.html"><img class="account-wordmark" src="assets/home-psd-001/mengyu-logo.webp" alt="MENGYU" width="2028" height="594"><span>梦玉的能力岛</span></a>
      <div class="context-copy">
        <div class="eyebrow">FREE ACCOUNT</div>
        <h1>先免费体验<br>再决定升级</h1>
        <p>注册后自动成为 Free。你可以使用平台工具、编辑和预览；需要下载或导出时，再选择 Pro 或 Max。</p>
        <div class="account-logic">
          <div class="logic-step"><b>Free</b><span>注册后即可开始体验</span></div>
          <div class="logic-arrow">→</div>
          <div class="logic-step"><b>Pro / Max</b><span>完整权限相同，只差使用周期</span></div>
        </div>
      </div>
      <div class="context-foot">注册本身免费，不会自动扣费或开通付费会员。</div>
    </section>

    <section class="account-task compact-account-task">
      <div class="task-wrap">
        <div class="mobile-brand"><a href="index.html"><img class="account-wordmark" src="assets/home-psd-001/mengyu-logo.webp" alt="MENGYU" width="2028" height="594"><span>梦玉的能力岛</span></a></div>
        <div class="eyebrow" style="color:var(--purple)">REGISTER</div>
        <h2>免费注册</h2>
        <p class="lead">验证手机号并设置密码，建立一个 Free 账户。</p>
        <div class="mode-note" id="modeNote" hidden><span class="mode-dot"></span><span id="modeText"></span></div>
        <form id="passwordAuthForm" novalidate>
          <div class="field">
            <label for="phone">账号（手机号）</label>
            <div class="phone-control"><span class="country">+86</span><input id="phone" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="请输入 11 位手机号"></div>
          </div>
          <div class="field">
            <label for="code">短信验证码</label>
            <div class="code-row"><input class="control" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位验证码"><button class="btn btn-secondary btn-code" id="sendCode" type="button">获取验证码</button></div>
          </div>
          <div class="dev-code" id="devCode" hidden><span>本轮测试验证码</span><b id="devCodeValue"></b></div>
          <div class="password-grid">
            <div class="field"><label for="password">设置密码</label><div class="password-control"><input id="password" type="password" autocomplete="new-password" maxlength="64" placeholder="8—64位，含字母和数字"><button type="button" data-password-toggle="password" aria-label="显示密码">显示</button></div></div>
            <div class="field"><label for="confirmPassword">确认密码</label><div class="password-control"><input id="confirmPassword" type="password" autocomplete="new-password" maxlength="64" placeholder="再次输入密码"><button type="button" data-password-toggle="confirmPassword" aria-label="显示确认密码">显示</button></div></div>
          </div>
          <button class="btn btn-primary" id="submitPassword" type="submit">注册并进入</button>
          <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
        </form>
        <div class="account-paths"><span>已经注册？<a href="login.html">直接登录</a></span><a href="auth.html?mode=register">只使用验证码进入</a></div>
        <nav class="account-policy-links" aria-label="注册说明"><a href="terms.html">用户协议</a><a href="privacy.html">隐私说明</a><a href="cancellation.html">账号注销</a></nav>
      </div>
    </section>
  </main>
  <script src="password-auth.js?v=site-pages-1"></script>
</body>
</html>
