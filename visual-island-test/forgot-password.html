<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>重置密码｜梦玉的能力岛</title>
  <meta name="description" content="验证注册手机号并重置账号密码">
  <link rel="stylesheet" href="account.css?v=site-audit-004">
  <script src="preview-mode.js"></script>
</head>
<body data-account-page="reset">
  <main class="account-shell">
    <section class="account-context" aria-label="密码重置说明">
      <a class="back-home" href="index.html"><img class="account-wordmark" src="assets/home-psd-001/mengyu-logo.webp" alt="MENGYU" width="2028" height="594"><span>梦玉的能力岛</span></a>
      <div class="context-copy">
        <div class="eyebrow">PASSWORD RESET</div>
        <h1>验证身份<br>重新设置密码</h1>
        <p>使用注册手机号接收验证码。验证通过后，新密码会替换旧密码，账户、项目和会员状态不会改变。</p>
        <div class="account-logic">
          <div class="logic-step"><b>验证手机号</b><span>确认这是你的登录账号</span></div>
          <div class="logic-arrow">→</div>
          <div class="logic-step"><b>设置新密码</b><span>原账户内容继续保留</span></div>
        </div>
      </div>
      <div class="context-foot">工作人员不会向你索要旧密码或短信验证码。</div>
    </section>

    <section class="account-task compact-account-task">
      <div class="task-wrap">
        <div class="mobile-brand"><a href="login.html"><span class="brand-mark"><i></i></span><span>返回登录</span></a></div>
        <div class="eyebrow" style="color:var(--purple)">RESET PASSWORD</div>
        <h2>重置密码</h2>
        <p class="lead">验证注册手机号，再设置一个新密码。</p>
        <div class="mode-note" id="modeNote" hidden><span class="mode-dot"></span><span id="modeText"></span></div>
        <form id="passwordAuthForm" novalidate>
          <div class="field"><label for="phone">账号（手机号）</label><div class="phone-control"><span class="country">+86</span><input id="phone" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="请输入注册手机号"></div></div>
          <div class="field"><label for="code">短信验证码</label><div class="code-row"><input class="control" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位验证码"><button class="btn btn-secondary btn-code" id="sendCode" type="button">获取验证码</button></div></div>
          <div class="dev-code" id="devCode" hidden><span>本轮测试验证码</span><b id="devCodeValue"></b></div>
          <div class="password-grid">
            <div class="field"><label for="password">新密码</label><div class="password-control"><input id="password" type="password" autocomplete="new-password" maxlength="64" placeholder="8—64位，含字母和数字"><button type="button" data-password-toggle="password" aria-label="显示新密码">显示</button></div></div>
            <div class="field"><label for="confirmPassword">确认新密码</label><div class="password-control"><input id="confirmPassword" type="password" autocomplete="new-password" maxlength="64" placeholder="再次输入新密码"><button type="button" data-password-toggle="confirmPassword" aria-label="显示确认密码">显示</button></div></div>
          </div>
          <button class="btn btn-primary" id="submitPassword" type="submit">保存新密码并登录</button>
          <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
        </form>
        <div class="account-paths"><a href="login.html">返回账号登录</a><a href="register.html">还没有账号？免费注册</a></div>
        <nav class="account-policy-links" aria-label="账户说明"><a href="terms.html">用户协议</a><a href="privacy.html">隐私说明</a><a href="cancellation.html">账号注销</a></nav>
      </div>
    </section>
  </main>
  <script src="password-auth.js?v=site-pages-1"></script>
</body>
</html>
