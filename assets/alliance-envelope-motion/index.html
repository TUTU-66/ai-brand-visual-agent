<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=750, height=750">
    <title>顶部信封轻微动效</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ink: #000000;
        --gold: #cbb08a;
        --light-gold: #f4d69b;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 750px;
        height: 750px;
        margin: 0;
        overflow: hidden;
        background: var(--ink);
      }

      #stage {
        position: relative;
        width: 750px;
        height: 750px;
        overflow: hidden;
        isolation: isolate;
        background: var(--ink);
      }

      .scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .asset {
        position: absolute;
        display: block;
        max-width: none;
        user-select: none;
        pointer-events: none;
      }

      #background {
        inset: 0;
        width: 750px;
        height: 750px;
        z-index: 0;
      }

      #ambient-glow {
        position: absolute;
        left: 115px;
        top: 180px;
        width: 520px;
        height: 360px;
        z-index: 1;
        border-radius: 50%;
        background: radial-gradient(
          ellipse at center,
          rgba(244, 214, 155, 0.42) 0%,
          rgba(203, 176, 138, 0.16) 34%,
          rgba(104, 72, 40, 0.05) 60%,
          rgba(0, 0, 0, 0) 78%
        );
        filter: blur(28px);
        transform-origin: 50% 50%;
        will-change: transform, opacity;
        pointer-events: none;
      }

      #stars {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }

      .star {
        position: absolute;
        border-radius: 50%;
        background: var(--light-gold);
        box-shadow: 0 0 5px rgba(244, 214, 155, 0.42);
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      #gold-waves-base,
      #gold-waves-sheen {
        left: -39px;
        top: 167px;
        width: 843px;
        height: 515px;
      }

      #wave-motion-group {
        position: absolute;
        inset: 0;
        z-index: 3;
        transform-origin: 50% 55%;
        will-change: transform;
        pointer-events: none;
      }

      #gold-waves-base {
        z-index: 0;
      }

      #gold-waves-sheen {
        z-index: 1;
        --flow-x: -340px;
        filter: brightness(2.15) saturate(1.07);
        mix-blend-mode: screen;
        -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0, 0, 0, 0.13) 18%, rgba(0, 0, 0, 0.72) 43%, #000 50%, rgba(0, 0, 0, 0.72) 57%, rgba(0, 0, 0, 0.13) 82%, transparent 100%);
        -webkit-mask-size: 340px 100%;
        -webkit-mask-repeat: no-repeat;
        -webkit-mask-position: var(--flow-x) 0;
        mask-image: linear-gradient(90deg, transparent 0%, rgba(0, 0, 0, 0.13) 18%, rgba(0, 0, 0, 0.72) 43%, #000 50%, rgba(0, 0, 0, 0.72) 57%, rgba(0, 0, 0, 0.13) 82%, transparent 100%);
        mask-size: 340px 100%;
        mask-repeat: no-repeat;
        mask-position: var(--flow-x) 0;
        will-change: opacity;
      }

      #envelope {
        left: 7px;
        top: 67px;
        width: 735px;
        height: 549px;
        z-index: 5;
      }

      #paper-light-window {
        position: absolute;
        inset: 0;
        z-index: 6;
        overflow: hidden;
        clip-path: polygon(18% 19.6%, 82% 19.6%, 82% 47%, 50% 64%, 18% 47%);
        pointer-events: none;
      }

      #paper-light {
        position: absolute;
        left: 150px;
        top: 105px;
        width: 450px;
        height: 380px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, rgba(255, 247, 218, 0.52) 0%, rgba(244, 214, 155, 0.22) 38%, rgba(203, 176, 138, 0) 72%);
        filter: blur(22px);
        mix-blend-mode: screen;
        will-change: transform, opacity;
      }

      #paper-edge-light {
        position: absolute;
        inset: 0;
        width: 750px;
        height: 750px;
        z-index: 7;
        overflow: visible;
        pointer-events: none;
      }

      #paper-edge-trail,
      #paper-edge-core {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0;
      }

      #paper-edge-trail {
        stroke: rgba(244, 214, 155, 0.46);
        stroke-width: 12;
        filter: url(#paper-edge-blur);
      }

      #paper-edge-core {
        stroke: rgba(255, 248, 216, 0.72);
        stroke-width: 2.2;
        filter: url(#paper-edge-soft-blur);
      }

      #paper-edge-flare {
        left: 0;
        top: 0;
        width: 120px;
        height: 40px;
        z-index: 7;
        opacity: 0;
        mix-blend-mode: screen;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      #seal {
        left: 327px;
        top: 446px;
        width: 97px;
        height: 127px;
        z-index: 1;
      }

      #seal-motion-group {
        position: absolute;
        inset: 0;
        z-index: 8;
        transform-origin: 375.5px 509.5px;
        will-change: transform;
        pointer-events: none;
      }

      #seal-aura {
        position: absolute;
        left: 309px;
        top: 427px;
        width: 133px;
        height: 158px;
        z-index: 0;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, rgba(244, 214, 155, 0.32) 0%, rgba(203, 176, 138, 0.12) 42%, transparent 72%);
        filter: blur(9px);
        mix-blend-mode: screen;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
        pointer-events: none;
      }

      #seal-sheen {
        position: absolute;
        left: 327px;
        top: 446px;
        width: 97px;
        height: 127px;
        z-index: 2;
        --seal-flow-x: -58px;
        background: url("assets/seal.png") center / 97px 127px no-repeat;
        filter: brightness(1.82) saturate(1.06);
        mix-blend-mode: screen;
        -webkit-mask-image: linear-gradient(118deg, transparent 0%, rgba(0, 0, 0, 0.08) 20%, rgba(0, 0, 0, 0.5) 42%, #000 50%, rgba(0, 0, 0, 0.5) 58%, rgba(0, 0, 0, 0.08) 80%, transparent 100%);
        -webkit-mask-size: 64px 184px;
        -webkit-mask-repeat: no-repeat;
        -webkit-mask-position: var(--seal-flow-x) -25px;
        mask-image: linear-gradient(118deg, transparent 0%, rgba(0, 0, 0, 0.08) 20%, rgba(0, 0, 0, 0.5) 42%, #000 50%, rgba(0, 0, 0, 0.5) 58%, rgba(0, 0, 0, 0.08) 80%, transparent 100%);
        mask-size: 64px 184px;
        mask-repeat: no-repeat;
        mask-position: var(--seal-flow-x) -25px;
        opacity: 0;
        will-change: opacity;
        pointer-events: none;
      }

      #arrow-soft {
        left: 355px;
        top: 639px;
        width: 40px;
        height: 20px;
        z-index: 9;
        will-change: opacity;
      }

      #arrow-main {
        left: 360px;
        top: 631px;
        width: 30px;
        height: 16px;
        z-index: 10;
        will-change: opacity;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-mibo" id="stage" data-composition-id="top-envelope-subtle-motion" data-start="0" data-duration="10" data-fps="30" data-width="750" data-height="750">

    <script>
      (function () {
        "use strict";

        var compositionId = "top-envelope-subtle-motion";
        var TAU = Math.PI * 2;
        var state = { phase: 0 };
        var glow = document.getElementById("ambient-glow");
        var waveMotionGroup = document.getElementById("wave-motion-group");
        var waveSheen = document.getElementById("gold-waves-sheen");
        var paperLight = document.getElementById("paper-light");
        var paperEdgeTrail = document.getElementById("paper-edge-trail");
        var paperEdgeCore = document.getElementById("paper-edge-core");
        var paperEdgeFlare = document.getElementById("paper-edge-flare");
        var sealMotionGroup = document.getElementById("seal-motion-group");
        var sealAura = document.getElementById("seal-aura");
        var sealSheen = document.getElementById("seal-sheen");
        var arrowSoft = document.getElementById("arrow-soft");
        var arrowMain = document.getElementById("arrow-main");
        var stars = Array.from(document.querySelectorAll(".star"));
        var starCycles = [1, 2, 1, 3, 2, 1, 2, 3, 1, 2, 3, 1, 2, 1, 3, 2, 1, 3];
        var starOffsets = [0.2, 1.4, 2.6, 0.8, 3.2, 4.5, 2.1, 5.2, 1.8, 3.8, 0.5, 4.9, 2.9, 1.1, 5.7, 3.5, 0.9, 4.2];
        var paperEdgeLength = paperEdgeCore.getTotalLength();
        var paperTrailLength = 96;
        var paperCoreLength = 54;

        paperEdgeTrail.style.strokeDasharray = paperTrailLength + " " + (paperEdgeLength + paperTrailLength);
        paperEdgeCore.style.strokeDasharray = paperCoreLength + " " + (paperEdgeLength + paperCoreLength);

        function exactLoopPhase(value) {
          return Math.abs(value - TAU) < 0.0000001 ? 0 : value;
        }

        function renderPose() {
          var phase = exactLoopPhase(state.phase);
          var progress = phase / TAU;
          var glowWave = Math.sin(phase);
          var arrowWave = Math.sin(phase - Math.PI / 2);
          var arrowPulse = (1 - Math.cos(phase * 2)) / 2;
          var flowEnvelope = Math.sin(progress * Math.PI);
          var flowX = -340 + progress * 1183;
          var edgeFade = Math.min(1, progress / 0.1, (1 - progress) / 0.1);
          edgeFade = edgeFade * edgeFade * (3 - 2 * edgeFade);
          var edgeDistance = progress * paperEdgeLength;
          var paperEdgePoint = paperEdgeCore.getPointAtLength(edgeDistance);
          var paperEdgeBefore = paperEdgeCore.getPointAtLength(Math.max(0, edgeDistance - 2));
          var paperEdgeAfter = paperEdgeCore.getPointAtLength(Math.min(paperEdgeLength, edgeDistance + 2));
          var paperEdgeAngle = Math.atan2(paperEdgeAfter.y - paperEdgeBefore.y, paperEdgeAfter.x - paperEdgeBefore.x) * 180 / Math.PI;
          var paperTrailOffset = -(progress * paperEdgeLength) + paperTrailLength / 2;
          var paperCoreOffset = -(progress * paperEdgeLength) + paperCoreLength / 2;
          var sealIntroProgress = Math.min(1, progress / 0.26);
          var sealIntroEase = sealIntroProgress * sealIntroProgress * (3 - 2 * sealIntroProgress);
          var sealPulse = Math.sin(sealIntroEase * Math.PI);
          var sealScale = 1 + sealPulse * 0.085;
          var sealSweepEnvelope = Math.pow(Math.max(0, sealPulse), 1.45);
          var sealFlowX = -58 + sealIntroEase * 203;
          var waveRiseProgress = Math.min(1, progress / 0.4);
          var waveRiseEase = waveRiseProgress * waveRiseProgress * (3 - 2 * waveRiseProgress);
          var waveRiseY = (1 - waveRiseEase) * 52;

          gsap.set(glow, { x: glowWave * 32, y: (1 - waveRiseEase) * 28, scale: 1 + glowWave * 0.025, opacity: 0.26 + glowWave * 0.1 });
          gsap.set(waveMotionGroup, { y: waveRiseY, opacity: 0.82 + waveRiseEase * 0.18 });
          waveSheen.style.setProperty("--flow-x", flowX + "px");
          gsap.set(waveSheen, { opacity: flowEnvelope * 0.72 });
          gsap.set(paperLight, { x: arrowWave * 40, opacity: 0.16 + arrowWave * 0.08 });
          paperEdgeTrail.style.strokeDashoffset = String(paperTrailOffset);
          paperEdgeCore.style.strokeDashoffset = String(paperCoreOffset);
          gsap.set(paperEdgeTrail, { opacity: edgeFade * 0.62 });
          gsap.set(paperEdgeCore, { opacity: edgeFade * 0.72 });
          gsap.set(paperEdgeFlare, {
            x: paperEdgePoint.x - 60,
            y: paperEdgePoint.y - 20,
            rotation: paperEdgeAngle,
            opacity: edgeFade * 0.52
          });
          sealSheen.style.setProperty("--seal-flow-x", sealFlowX + "px");
          gsap.set(sealMotionGroup, { scale: sealScale });
          gsap.set(sealSheen, { opacity: sealSweepEnvelope * 0.34 });
          gsap.set(sealAura, { opacity: 0.04 + sealSweepEnvelope * 0.07, scale: 1 + sealSweepEnvelope * 0.02 });
          gsap.set(arrowSoft, { y: arrowPulse * 4, opacity: 0.28 + arrowPulse * 0.46 });
          gsap.set(arrowMain, { y: arrowPulse * 4, opacity: 0.92 - arrowPulse * 0.24 });

          stars.forEach(function (star, index) {
            var value = Math.sin(phase * starCycles[index] + starOffsets[index]);
            gsap.set(star, { opacity: 0.28 + value * 0.24, scale: 1 + value * 0.22 });
          });
        }

        var tl = gsap.timeline({ paused: true });
        tl.to(state, { phase: TAU, duration: 10, ease: "none", onUpdate: renderPose }, 0);
        renderPose();
        tl.seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines[compositionId] = tl;

        var forcedStatic = new URLSearchParams(location.search).get("motion") === "off";
        var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
        function syncPlayback() {
          if (forcedStatic || reduceMotion.matches || document.hidden) {
            tl.pause();
            if (forcedStatic || reduceMotion.matches) tl.seek(0);
          } else {
            tl.repeat(-1).play();
          }
        }
        document.addEventListener("visibilitychange", syncPlayback);
        if (reduceMotion.addEventListener) reduceMotion.addEventListener("change", syncPlayback);
        syncPlayback();
      })();
    </script>
